تکمیل و اصلاح نهایی نرم‌افزار محافظ گستران (MohafezGostaran)

لطفاً پروژه را با حفظ اطلاعات و ساختار فعلی، طبق موارد زیر اصلاح و تکمیل کن:

۱. طراحی فارسی، زیبا و حرفه‌ای، با پشتیبانی کامل از زبان فارسی و تاریخ شمسی.

۲. پشتیبانی از دو آیکون اصلی برنامه:

- آیکون آبی و طلایی با نوشته محافظ گستران.
- آیکون مشکی و طلایی با تصویر دوربین و خانه، بدون نوشته.
  امکان انتخاب آیکون در تنظیمات برنامه و در صورت امکان تغییر آیکون واقعی برنامه در گوشی.

۳. ثبت و مدیریت مشتریان شامل نام، شماره تلفن، آدرس و موقعیت روی نقشه.

۴. ثبت فاکتورهای فروش، خرید، برگشت از فروش، برگشت از خرید و پیش‌فاکتور.

۵. در هر فاکتور، کالا یا خدمت، تعداد، قیمت واحد و مبلغ هر ردیف باید جداگانه قابل ورود و ویرایش باشد.

۶. پیش‌فاکتور باید قابل چاپ و اشتراک‌گذاری باشد و تا زمان تبدیل به فاکتور قطعی، در حساب فروش و پرداخت واقعی محاسبه نشود.

۷. مبالغ تمام بخش‌ها بر اساس ریال ایران باشند.

۸. حساب مشتری یکپارچه باشد؛ تمام فاکتورها و پرداخت‌های یک مشتری در تاریخ‌های مختلف در یک حساب جمع شوند و تاریخچه کامل تراکنش‌ها نمایش داده شود.

۹. مدیریت حساب فروشندگان و پرداخت‌ها.

۱۰. مدیریت انبار؛ خرید موجب افزایش موجودی، فروش موجب کاهش موجودی و برگشت کالا موجب اصلاح موجودی شود.

۱۱. گزارش ماهانه درآمد، هزینه، سود و زیان همراه نمودار.

۱۲. طراحی فاکتور دقیقاً مطابق تصویر مرجع تأییدشده با رنگ‌های سرمه‌ای، آبی، طلایی و فیروزه‌ای، همراه با اطلاعات کارت و شماره شبا و امکان انتخاب رنگ پس‌زمینه.

۱۳. اشتراک‌گذاری فاکتور در سه قالب PDF، تصویر باکیفیت و متن قابل کپی و ارسال. تمام جزئیات اقلام در خروجی‌ها نمایش داده شوند. قسمت کنترل‌های داخلی برنامه نباید در فاکتور مشتری دیده شود.

۱۴. یادآوری قرارها و کارها، پیامک عادی و پیام رضایت مشتری یک ماه پس از انجام پروژه. پیام مانده حساب فقط پس از تأیید کاربر ارسال شود.

۱۵. ذخیره اطلاعات روی خود گوشی، امکان استفاده آفلاین، پشتیبان‌گیری و بازیابی اطلاعات. اطلاعات هر گوشی مستقل از گوشی‌های دیگر باشد.

۱۶. رفع کامل ایرادهای ثبت کالا، تعداد و قیمت، محاسبه مانده مشتری و خروجی فاکتورها.

۱۷. حفظ اطلاعات قبلی هنگام به‌روزرسانی برنامه.

مهم: قبل از ساخت APK، پروژه را از نظر خطا بررسی کن، قابلیت‌ها را واقعاً پیاده‌سازی و آزمایش کن و فقط در صورت موفقیت ساخت، فایل APK قابل نصب ارائه بده. هیچ قابلیت ناقص یا آزمایش‌نشده‌ای را تکمیل‌شده اعلام نکن.
